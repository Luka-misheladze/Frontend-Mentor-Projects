<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
	<title>Frontend Mentor | Product preview card component</title>
	<link rel="stylesheet" href="style.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap" rel="stylesheet">
</head>
<body>
	<div class="container">
		<div class="left-side"><img src="./images/image-product-desktop.jpg" alt="image-product-desktop"></div>
		<div class="right-side">
			<div class="text">
				<p class="p1">PERFUME</p>
				<h2>Gabrielle Essence Eau De Parfum</h2>
				<p class="p2">	
					A floral, solar and voluptuous interpretation composed by Olivier Polge,
					Perfmuer-Creator for the House of CHANEL.
				</p>
				<div class="price-tag">
					<div class="left-p"><p>$149.99</p></div>
					<div class="right-p">$169.99</div>
				</div>
				<div class="button">
					<button type="button"><img src="./images/icon-cart.svg" alt="">Add to Cart</button>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
