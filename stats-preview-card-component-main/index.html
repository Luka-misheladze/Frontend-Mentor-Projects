<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <title>Frontend Mentor | Stats preview card component</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="left-side">
            <h1>Get <span class="purple">insights</span> that help your business grow.</h1>
            <p  class="main-p">
                Discover the benefits of data analytics and make better
                decisions regarding revenue, customer experience,
                and overall efficiency.
            </p>
            <div class="rate">
                <div class="companies">
                    <p class="higer-p">10k+</p>
                    <p class="lower-p">COMPANIES</p> 
                </div>
                <div class="templates">
                    <p class="higer-p">314</p>
                    <p class="lower-p">TEMPLATES</p>
                </div>
                <div class="queries">
                    <p class="higer-p">12M+</p>
                    <p class="lower-p">QUERIES</p>
                </div>
            </div>
        </div>
        <div class="right-side">
            <img src="./images/image-header-desktop.jpg" alt="image-header-desktop">
        </div>
    </div>
</body>
</html>
